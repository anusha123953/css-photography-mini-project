<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography App</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            <h2>Photography</h2>
            <i class="fa-solid fa-bars"></i>
        </div>

        <hr>

        <div class="menu">
            <a href="#"><i class="fa-regular fa-image"></i> Gallery</a>
            <a href="#"><i class="fa-solid fa-link"></i> Shortcuts</a>
            <a href="#"><i class="fa-solid fa-palette"></i> Exhibits</a>
            <a href="#"><i class="fa-regular fa-calendar"></i> Events</a>
            <a href="#"><i class="fa-solid fa-store"></i> Store</a>
            <a href="#"><i class="fa-solid fa-phone"></i> Contact</a>
            <a href="#"><i class="fa-regular fa-comments"></i> Feedback</a>
        </div>

        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        </div>

    </div>

    <!-- Main Background Image -->
    <div class="main-content">
        <img src="./photo.jpg" alt="Camera photograph">
    </div>

</body>

</html>
